# THE place you set models & parameters. Code reads only from here.
seed: 42
device: cuda

data:
  raw_dir: data/raw/krishipath
  chapter_pages_only: true
  chapter_ranges:
    1: [14, 19]
    2: [20, 25]
    3: [26, 28]
    4: [29, 29]
    5: [30, 34]
    6: [35, 55]
    7: [56, 122]
    8: [123, 135]
    9: [136, 138]
    10: [139, 144]
    11: [145, 147]
    12: [148, 156]
    13: [157, 159]
    14: [160, 168]
    15: [169, 175]
    16: [176, 230]
    17: [231, 249]
    18: [250, 256]
    19: [257, 262]
    20: [263, 266]
    21: [267, 269]
    22: [270, 317]
    23: [318, 323]
    24: [324, 327]
    25: [328, 346]
    26: [347, 351]
    27: [352, 355]
    28: [356, 364]
    29: [365, 374]
    30: [375, 382]
    31: [383, 385]
    32: [386, 389]
    33: [390, 391]
  chapter_splits:
    train: [2, 3, 4, 5, 7, 9, 10, 11, 13, 15, 16, 18, 19, 20, 21, 22, 24, 26, 27, 28, 29, 31, 33]
    validation: [1, 12, 17, 25, 32]
    test: [6, 8, 14, 23, 30]

preprocess:
  enabled: true
  output_dir: data/interim/preprocessed
  trim_left_px: 80
  trim_border_px: 0
  deskew: true
  min_skew_degrees: 0.15
  max_skew_degrees: 2.0

enhance:
  enabled: false
  model: "none"
  type: "none"   # or "vae" / "none"
layout:
  model: juliozhao/DocLayout-YOLO-DocStructBench
  weights_filename: doclayout_yolo_docstructbench_imgsz1024.pt
  allow_download: true
  device: cuda
  imgsz: 1024
  score_thr: 0.2
  reading_order: top-to-bottom
ocr:
  model: easyocr
  languages: [bn, en]
  device: cuda
  min_confidence: 0.0
embed:     {model: "BAAI/bge-m3", dim: 1024}
index:     {type: "faiss:hnsw", path: "data/index", chunk_tokens: 256, overlap: 32}
retrieve:  {k: 10, k_step: 10, k_max: 40, weak_threshold: 0.35, rerank: true, reranker: "cross-encoder/ms-marco-MiniLM-L6-v2"}   # k_step/k_max/weak_threshold drive evidence-gated re-search
agent:     {max_steps: 8, autonomy: "act-with-approval", budget_usd: 0.05, cost_per_call_usd: 0.0, research: true, reformulate: true, evidence_chunks: 5, min_support: 0.3}
# provider "none" = extractive baseline answers (no API key needed). For a real LLM set provider to
# "openai_compat" plus base_url/model (Groq, Gemini-OpenAI, OpenRouter, ...) and put LLM_API_KEY in .env.
llm:       {provider: "none", base_url: "", model: "", temperature: 0.0, max_tokens: 512, timeout_s: 60}
rl:        {algo: "ppo", train_policy: false}                         # bonus: set true
serve:     {batch: true}
deploy:    {target: "hf-spaces"}
